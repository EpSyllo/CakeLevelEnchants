enchantments:
  # Выключить/Включить (Любые изменения вступают в силу только после перезапуска сервера
  enabled: true
  # Доступные параметры:
  # max-level    - Новый максимальный уровень зачарования
  #
  # weight       - Вес/шанс появления в столе зачарований
  #                Чем выше число, тем чаще выпадает зачарование
  #                Стандартные значения ванилы для ориентира:
  #                  10 = Частые (Острота, Защита, Эффективность, Сила)
  #                   5 = Обычные (Прочность, Невесомость, Пронзание)
  #                   2 = Редкие (Добыча, Удача, Огненный заговор, Шелковое касание)
  #                   1 = Очень редкие (Бесконечность, Починка, Шипы)
  #                Укажите -1, чтобы оставить ванильное значение
  #
  # anvil-cost   - Базовый множитель стоимости на наковальне
  #                При объединении этот множитель умножается на уровень зачарования
  #                Для высоких уровней (например, Sharpness VII) стандартный множитель
  #                приводит к огромной цене в опыте, значение 1 делает крафт доступным
  #                Стандартные значения ванилы:
  #                  1 = Острота, Защита, Эффективность, Сила
  #                  2 = Добыча, Прочность, Невесомость, Удача
  #                  4 = Огненный заговор, Шелковое касание, Дыхание
  #                  8 = Шипы, Бесконечность, Починка
  #                Укажите -1, чтобы оставить ванильное значение
  #                Поддерживается также краткая запись, если нужен только уровень: unbreaking: 5
  list:
    sharpness:
      max-level: 7
      weight: 10
      anvil-cost: 1

    efficiency:
      max-level: 10
      weight: 10
      anvil-cost: 1

    protection:
      max-level: 5
      weight: 10
      anvil-cost: 1

    unbreaking:
      max-level: 5
      weight: 5
      anvil-cost: 1

    fortune:
      max-level: 5
      weight: 2
      anvil-cost: 1

    looting:
      max-level: 5
      weight: 2
      anvil-cost: 1

anvil:
  # Снятие ограничения "Слишком дорого!"
  remove-too-expensive: true
  # Ограничение максимальной стоимости в опыте
  # Ванильный клиент игры блокирует забор предмета, если цена >= 40 уровней
  # Значение 39 позволяет забирать абсолютно любой предмет в выживании
  # Укажите -1, если не хотите срезать стоимость, актуально для серверов с клиентскими модами
  cost-cap: 39